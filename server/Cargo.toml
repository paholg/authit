[package]
edition = "2024"
name = "server"
version = "0.1.0"

[dependencies]
axum = { version = "0.8" }
base64.workspace = true
config = { version = "0.15.25", features = ["toml"] }
cookie = "0.18"
dioxus = { workspace = true, features = ["fullstack", "server"] }
hmac = "0.13"
jiff.workspace = true
jiff-sqlx = { version = "0.2.0", features = ["sqlite"] }
libsqlite3-sys = { version = "0.37", features = ["bundled-sqlcipher"] }
oauth2 = "5"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "uuid", "derive", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
types = { workspace = true, features = ["server"] }
uuid = { workspace = true, features = ["v7"] }

[package.metadata.cargo-machete]
# We need to depend on it for the sqlcipher feature.
ignored = ["libsqlite3-sys"]
